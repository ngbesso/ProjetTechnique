[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Body()/Path() dans les valeurs par défaut sont le pattern
# standard de FastAPI (documenté officiellement) — pas un vrai bug B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]
